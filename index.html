<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Trend - Special For You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            user-select: none;
            cursor: pointer;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* Teks "My Love" utama di tengah */
        .teks-utama {
            position: absolute;
            z-index: 5;
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 15px #ff2d55, 0 0 35px #ff2d55, 0 0 60px #ff2d55;
            pointer-events: none;
            opacity: 0;
            transform: scale(0);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }

        .teks-utama.aktif {
            opacity: 1;
            transform: scale(1);
            animation: nafasHalus 2s infinite ease-in-out alternate;
        }

        /* ✉️ Kotak Pesan Kejutan / Surat Cinta khas @fenidev */
        .kotak-pesan {
            position: absolute;
            z-index: 20;
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid #ff2d55;
            box-shadow: 0 0 25px rgba(255, 45, 85, 0.6);
            border-radius: 15px;
            padding: 30px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: scale(0.5) translateY(50px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .kotak-pesan.muncul {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .kotak-pesan h2 {
            margin-top: 0;
            color: #ff6b8b;
            text-shadow: 0 0 10px #ff2d55;
        }

        .kotak-pesan p {
            line-height: 1.6;
            font-size: 1.1rem;
            color: #eee;
        }

        .tombol-tutup {
            background: #ff2d55;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 0 10px #ff2d55;
            transition: transform 0.2s;
        }

        .tombol-tutup:hover {
            transform: scale(1.1);
        }

        .petunjuk {
            position: absolute;
            bottom: 30px;
            color: #666;
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 1px;
            animation: berkedipSmooth 1.5s infinite ease-in-out alternate;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 10px rgba(255, 45, 85, 0.3);
        }

        @keyframes nafasHalus {
            0% { transform: scale(0.96); }
            100% { transform: scale(1.04); }
        }

        @keyframes berkedipSmooth {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="canvasSistem"></canvas>
        <div id="textMyLove" class="teks-utama">My Love</div>
        
        <div id="kotakPesan" class="kotak-pesan">
            <h2>Hai Ndut! ❤️</h2>
            <p>Aku cuma mau bilang makasih ya udah selalu ada. Tetap sama aku terus ya, jangan bosen-bosen! You are the best thing that ever happened to me. ✨</p>
            <button class="tombol-tutup" onclick="tutupPesan(event)">Close ❤️</button>
        </div>

        <div id="petunjukTeks" class="petunjuk">Ketuk Layar Beberapa Kali...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvasSistem');
        const ctx = canvas.getContext('2d');
        const textMyLove = document.getElementById('textMyLove');
        const petunjukTeks = document.getElementById('petunjukTeks');
        const kotakPesan = document.getElementById('kotakPesan');

        function aturUkuran() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        aturUkuran();
        window.addEventListener('resize', aturUkuran);
        
        let daftarKupuKupu = [];
        let waktuLove = 0;
        let sedangDitekan = false;
        let koordinatTekan = { x: 0, y: 0 };
        let jumlahKlik = 0;
        let pesanSudahMuncul = false;

        class KupuKupu {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const sudutAcak = Math.random() * Math.PI * 2;
                const kecepatanAwal = 6 + Math.random() * 7;
                
                this.kecepatanX = Math.cos(sudutAcak) * kecepatanAwal;
                this.kecepatanY = Math.sin(sudutAcak) * kecepatanAwal;
                this.gesekan = 0.97; 
                this.dayaApung = -0.06; 
                this.ukuran = 12 + Math.random() * 14; 
                this.sisaUmur = 1.0;
                this.kecepatanPudar = 0.012 + Math.random() * 0.015;
                this.kepakan = Math.random() * 100;
                this.kecepatanKepak = 0.25 + Math.random() * 0.2;
            }

            update() {
                this.kecepatanX *= this.gesekan;
                this.kecepatanY *= this.gesekan;
                this.kecepatanY += this.dayaApung;
                this.x += this.kecepatanX;
                this.y += this.kecepatanY;
                this.sisaUmur -= this.kecepatanPudar;
                this.kepakan += this.kecepatanKepak;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.sisaUmur;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff2d55';
                ctx.translate(this.x, this.y);
                const efekKepak = Math.cos(this.kepakan) * 0.5 + 0.7;
                ctx.scale(efekKepak, 1.0); 
                ctx.font = `${this.ukuran}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🦋", 0, 0);
                ctx.restore();
            }
        }

        function posisiLove(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: x, y: -y };
        }

        function jalankanSistem() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const pusatX = canvas.width / 2;
            const pusatY = canvas.height / 2;
            const skalaLove = 15 + Math.sin(waktuLove) * 0.4;
            waktuLove += 0.03;

            ctx.save();
            ctx.shadowBlur = 35;
            ctx.shadowColor = '#ff2d55';
            ctx.strokeStyle = '#ff6b8b';
            ctx.lineWidth = 4.5;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            for (let i = 0; i < Math.PI * 2; i += 0.01) {
                const pos = posisiLove(i);
                const plotX = pusatX + pos.x * skalaLove;
                const plotY = pusatY + pos.y * skalaLove;
                if (i === 0) ctx.moveTo(plotX, plotY);
                else ctx.lineTo(plotX, plotY);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            if (sedangDitekan && !pesanSudahMuncul) {
                for(let i = 0; i < 3; i++) { 
                    daftarKupuKupu.push(new KupuKupu(koordinatTekan.x, koordinatTekan.y));
                }
            }

            for (let i = daftarKupuKupu.length - 1; i >= 0; i--) {
                let kupu = daftarKupuKupu[i];
                kupu.update();
                kupu.draw();
                if (kupu.sisaUmur <= 0) daftarKupuKupu.splice(i, 1);
            }

            requestAnimationFrame(jalankanSistem);
        }

        function aksiSentuhDimulai(x, y) {
            if (pesanSudahMuncul) return;

            sedangDitekan = true;
            koordinatTekan.x = x;
            koordinatTekan.y = y;
            jumlahKlik++;

            // Munculkan teks My Love pada klik pertama
            if (jumlahKlik === 1) {
                textMyLove.classList.add('aktif');
                petunjukTeks.innerText = "Ketuk terus sampai surat terbuka...";
            }

            // Memicu munculnya surat cinta setelah klik ke-10 (khas interaktif ala @fenidev)
            if (jumlahKlik >= 10 && !pesanSudahMuncul) {
                pesanSudahMuncul = true;
                sedangDitekan = false;
                kotakPesan.classList.add('muncul');
                petunjukTeks.style.display = 'none';
            }
        }

        function tutupPesan(event) {
            event.stopPropagation(); // Biar klik tombol close ga memicu deteksi klik layar lagi
            kotakPesan.classList.remove('muncul');
            setTimeout(() => {
                pesanSudahMuncul = false;
                jumlahKlik = 0;
                petunjukTeks.style.display = 'block';
                petunjukTeks.innerText = "Ketuk Layar di Sini...";
            }, 800);
        }

        // --- EVENTS LISTENER ---
        window.addEventListener('mousedown', (e) => aksiSentuhDimulai(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => { if (sedangDitekan) { koordinatTekan.x = e.clientX; koordinatTekan.y = e.clientY; } });
        window.addEventListener('mouseup', () => sedangDitekan = false);
        window.addEventListener('touchstart', (e) => aksiSentuhDimulai(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', (e) => { if (sedangDitekan) { koordinatTekan.x = e.touches[0].clientX; koordinatTekan.y = e.touches[0].clientY; } });
        window.addEventListener('touchend', () => sedangDitekan = false);

        jalankanSistem();
    </script>

</body>
</html>
